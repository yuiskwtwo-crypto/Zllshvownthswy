<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Library Konfeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden; /* Biar balon nggak bikin scrollbar muncul */
            position: relative;
        }

        /* 1. ANIMASI BALON */
        .balloon {
            width: 80px;
            height: 100px;
            background: rgba(255, 107, 129, 0.7);
            border-radius: 80% 80% 80% 80%;
            position: absolute;
            bottom: -120px;
            z-index: 1;
            animation: moveBalloon 8s linear infinite;
        }
        .balloon:nth-child(1) { left: 10%; background: rgba(255, 107, 129, 0.7); animation-duration: 7s; }
        .balloon:nth-child(2) { left: 30%; background: rgba(106, 176, 245, 0.7); animation-duration: 9s; animation-delay: 2s; }
        .balloon:nth-child(3) { left: 50%; background: rgba(255, 234, 167, 0.7); animation-duration: 6s; animation-delay: 1s; }
        .balloon:nth-child(4) { left: 70%; background: rgba(123, 237, 159, 0.7); animation-duration: 8s; animation-delay: 3s; }
        .balloon:nth-child(5) { left: 85%; background: rgba(255, 159, 243, 0.7); animation-duration: 10s; animation-delay: 1.5s; }

        @keyframes moveBalloon {
            0% { bottom: -120px; transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(30px) rotate(15deg); }
            100% { bottom: 105vh; transform: translateX(-30px) rotate(-15deg); }
        }

        /* 2. KARTU UTAMA */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            z-index: 10; /* Kartu tetap di depan balon */
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }

        /* Form Input Nama */
        .login-box h2 { color: #ff4757; margin-bottom: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ff758c;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-size: 1rem;
        }
        .error-msg { color: #ff4757; font-size: 0.9rem; margin-top: 10px; display: none; }

        #contentUtama { display: none; }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4757;
            margin-bottom: 15px;
        }

        /* 3. ANIMASI TOMBOL GOYANG (WIGGLE) */
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            animation: wiggle 0.4s ease-in-out infinite;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .hidden-message {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #ffeaa7;
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Balon Berterbangan -->
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <div class="card">
        <!-- LAYAR 1: Input Nama -->
        <div id="loginBox" class="login-box">
            <h2>🔒 Masukkan Nama Kamu</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem;">Siapa nama kamu?</p>
            <input type="text" id="inputNama" placeholder="Ketik nama di sini..." onkeypress="handleKeyPress(event)">
            <button onclick="cekNama()">Buka Akses 🚀</button>
            <p id="errorMsg" class="error-msg">❌ Maaf, nama kamu nggak terdaftar!</p>
        </div>

        <!-- LAYAR 2: Ucapan Ultah -->
        <div id="contentUtama">
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300" alt="Foto Ultah" class="profile-img">
            
            <h1 id="sapaan" style="color: #ff4757; margin-bottom: 10px;">Selamat Ulang Tahun! 🎉</h1>
            <p style="color: #57606f; margin-bottom: 20px;">Semoga panjang umur, sehat selalu, dan semua impianmu bisa tercapai tahun ini!</p>
            
            <button onclick="kejutan()">Klik Buat Kejutan! 🎁</button>

            <div id="pesanRahasia" class="hidden-message">
                <p>Wish you all the best ya! Ditunggu makan-makannya 😆✨</p>
            </div>
        </div>
    </div>

    <script>
        // DAFTAR NAMA YANG BISA MASUK (Pake huruf kecil semua)
        const daftarNama = ["budi", "budi santoso", "budin"];

        function cekNama() {
            const input = document.getElementById("inputNama").value.trim().toLowerCase();
            const error = document.getElementById("errorMsg");

            if (daftarNama.includes(input)) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("contentUtama").style.display = "block";
                
                // Konfeti saat berhasil login
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            } else {
                error.style.display = "block";
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") cekNama();
        }

        function kejutan() {
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
            document.getElementById("pesanRahasia").style.display = "block";
        }
    </script>
</body>
</html>
