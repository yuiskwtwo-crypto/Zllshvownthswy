<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Library Konfeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Desain Kotak Utama */
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        /* Form Input Nama di Awal */
        .login-box h2 {
            color: #ff4757;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ff758c;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-size: 1rem;
        }
        .error-msg {
            color: #ff4757;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        /* Isi Konten Ulang Tahun (Sembunyi dulu) */
        #contentUtama {
            display: none;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4757;
            margin-bottom: 15px;
        }
        h1 { color: #ff4757; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #57606f; font-size: 1rem; line-height: 1.5; margin-bottom: 20px; }
        
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }

        .hidden-message {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #ffeaa7;
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- LAYAR 1: Input Nama -->
        <div id="loginBox" class="login-box">
            <h2>🔒 Masukkan Nama Kamu</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem;">Cuma yang berulang tahun yang boleh masuk!</p>
            <input type="text" id="inputNama" placeholder="Ketik nama kamu di sini..." onkeypress="handleKeyPress(event)">
            <button onclick="cekNama()">Buka Akses 🚀</button>
            <p id="errorMsg" class="error-msg">❌ Uppss! Namanya salah, kamu bukan yang lagi ultah ya?</p>
        </div>

        <!-- LAYAR 2: Konten Ulang Tahun -->
        <div id="contentUtama">
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300" alt="Foto Ultah" class="profile-img">
            
            <h1 id="sapaan">Selamat Ulang Tahun! 🎉</h1>
            <p>Semoga di umur yang baru ini makin sukses, sehat selalu, dan semua cita-citanya tercapai!</p>
            
            <button onclick="kejutan()">Klik Buat Kejutan! 🎁</button>

            <div id="pesanRahasia" class="hidden-message">
                <p>Wish you all the best ya! Jangan lupa makan-makannya 😆✨</p>
            </div>
        </div>
    </div>

    <script>
        // ATUR NAMA RAHASIA DI SINI (Ganti dengan nama temenmu, bisa huruf kecil/kapital)
        const namaBenar = "Zilless";

        function cekNama() {
            const input = document.getElementById("inputNama").value.trim();
            const error = document.getElementById("errorMsg");

            // Mengecek nama tanpa peduli huruf besar/kecil (lowercase)
            if (input.toLowerCase() === namaBenar.toLowerCase()) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("contentUtama").style.display = "block";
                document.getElementById("sapaan").innerText = "Selamat Ulang Tahun, " + namaBenar + "! 🎉";
                
                // Efek konfeti langsung saat berhasil masuk
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            } else {
                error.style.display = "block";
            }
        }

        // Fitur tekan 'Enter' langsung di keyboard
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                cekNama();
            }
        }

        function kejutan() {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            document.getElementById("pesanRahasia").style.display = "block";
        }
    </script>
</body>
</html>
