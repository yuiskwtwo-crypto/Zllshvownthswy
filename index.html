<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise & Vending Machine</title>
    <!-- Google Fonts for Aesthetic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTAINER UTAMA -->
    <div class="card">
        <!-- STEP 1: LOGIN NAMA -->
        <div id="loginBox" class="step-box">
            <h1 class="title-aesthetic">🔒 Access Gate</h1>
            <p class="sub-title">Who are you?</p>
            <div class="input-wrapper">
                <input type="text" id="inputNama" placeholder="Type your name here.." onkeypress="handleKeyPress(event)">
            </div>
            <button class="btn-primary" onclick="cekNama()">Buka Akses 🚀</button>
            <p id="errorMsg" class="error-msg">❌ Upssiee! Penyusup kamu yaakk</p>
        </div>

        <!-- STEP 2: TIUP LILIN ULANG TAHUN -->
        <div id="candleStep" class="step-box hidden">
            <h1 class="title-aesthetic">🎂 Make a Wish!</h1>
            <p class="sub-title">Klik lilin di bawah untuk meniup apinya 💨✨</p>

            <div class="cake-container">
                <!-- Lilin Birthday HD & Realistic Flame -->
                <div class="candle" id="birthdayCandle" onclick="blowCandle()">
                    <div class="smoke" id="smoke"></div>
                    <div class="flame" id="flame">
                        <div class="flame-inner"></div>
                        <div class="flame-glow"></div>
                    </div>
                    <div class="wick"></div>
                    <div class="wax-body">
                        <div class="stripe"></div>
                        <div class="stripe"></div>
                        <div class="stripe"></div>
                    </div>
                </div>

                <!-- Kue Ulang Tahun Aesthetic -->
                <div class="cake">
                    <div class="icing"></div>
                    <div class="frosting-layer"></div>
                    <div class="cherry"></div>
                </div>
            </div>

            <p class="blow-hint" id="blowHint">Blow the candles!</p>
            <button class="btn-primary hidden" id="nextToVendingBtn" onclick="goToVending()">Next!! 🎁</button>
        </div>

        <!-- STEP 3: VENDING MACHINE HADIAH -->
        <div id="vendingStep" class="step-box hidden">
            <h1 class="title-aesthetic mini">🎰 Birthday Vending</h1>
            
            <div class="vending-machine">
                <!-- Lampu Berkedip -->
                <div class="lights">
                    <div class="light"></div>
                    <div class="light"></div>
                    <div class="light"></div>
                    <div class="light"></div>
                </div>

                <!-- Layar Digital -->
                <div class="screen" id="machineScreen">
                    INSERT BIRTHDAY COIN
                </div>

                <!-- Slot Item Keluar -->
                <div class="dispenser-window" id="dispenser">
                    <!-- Item yang jatuh akan muncul di sini secara dinamis -->
                </div>

                <!-- Tombol Koin -->
                <button class="btn-coin" id="coinBtn" onclick="dispenseItems()">
                    🪙 INSERT COIN
                </button>
            </div>

            <!-- Pesan / Hadiah Utama -->
            <div id="pesanRahasia" class="hidden-message">
                <p>🎁 <strong>HADIAH UTAMA:</strong><br>Happy belated birthday, zilless. Tetap jadi satu satunya orang yang aku kenal yaa!! 😆✨</p>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
